name: Build Radar DLL

on:
  push:
    branches: [ "only-radar-old" ]
  pull_request:
    branches: [ "only-radar-old" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        ref: only-radar-old
        path: main-repo

    - name: Checkout Plugin SDK
      uses: actions/checkout@v4
      with:
        repository: DK22Pac/plugin-sdk
        path: plugin-sdk

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Pre-Build Plugin SDK Library
      run: |
        $sdkPath = "$(Get-Location)\plugin-sdk"
        $env:PLUGIN_SDK_DIR = $sdkPath
        
        cd plugin-sdk\plugin_sa
        # Mengompilasi berkas proyek .vcxproj secara langsung dengan konfigurasi Release asli SDK
        msbuild plugin_sa.vcxproj /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143

    - name: Build Project with Plugin SDK
      run: |
        $sdkPath = "$(Get-Location)\plugin-sdk"
        $env:PLUGIN_SDK_DIR = $sdkPath
        echo "PLUGIN_SDK_DIR is set to: $env:PLUGIN_SDK_DIR"
        
        # Menyusun folder pencarian berkas include dan library (.lib)
        $includeDirs = "${sdkPath}\shared;${sdkPath}\plugin_sa;${sdkPath}\plugin_sa\game_sa"
        $libDirs = "${sdkPath}\output"
        
        cd main-repo
        msbuild radar-trilogy-sa.sln /p:Configuration="Release GTA-SA" /p:Platform=Win32 /p:PlatformToolset=v143 /p:AdditionalIncludeDirectories="`"$includeDirs`"" /p:AdditionalLibraryDirectories="`"$libDirs`""

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-Radar-ASI
        path: |
          main-repo/**/Release GTA-SA/*.asi
          main-repo/**/Release GTA-SA/*.dll
          main-repo/**/Release/*.asi
          main-repo/**/Release/*.dll
