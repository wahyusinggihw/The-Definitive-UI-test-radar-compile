name: Build Radar DLL

on:
  push:
    branches: [ "only-radar-old" ]
  pull_request:
    branches: [ "only-radar-old" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout Radar Project
        uses: actions/checkout@v4
        with:
          ref: only-radar-old
          path: main-repo

      - name: Checkout Plugin SDK
        uses: actions/checkout@v4
        with:
          repository: DK22Pac/plugin-sdk
          path: plugin-sdk
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set Plugin SDK Environment
        shell: pwsh
        run: |
          $sdkPath = Join-Path $env:GITHUB_WORKSPACE "plugin-sdk"
          "PLUGIN_SDK_DIR=$sdkPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8
          Write-Host "PLUGIN_SDK_DIR = $sdkPath"

      - name: Check Plugin SDK Source
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "CHECKING PLUGIN SDK SOURCE"
          Write-Host "========================================"
          Write-Host "Plugin SDK path: $env:PLUGIN_SDK_DIR"

          $enumPath = Join-Path $env:PLUGIN_SDK_DIR "Plugin_SA\game_sa\enums"
          if (Test-Path $enumPath) {
              Write-Host "Enum directory found: $enumPath"
          }
          else {
              Write-Error "Enum directory not found: $enumPath"
              exit 1
          }

          $generator = Join-Path $env:PLUGIN_SDK_DIR "tools\generate\Visual Studio.bat"
          if (Test-Path $generator) {
              Write-Host "Visual Studio generator found: $generator"
          }
          else {
              Write-Error "Visual Studio generator not found: $generator"
              exit 1
          }

      - name: Generate Plugin SDK Visual Studio Projects
        shell: cmd
        run: |
          cd /d "%PLUGIN_SDK_DIR%"
          set PLUGIN_SDK_DIR=%GITHUB_WORKSPACE%\plugin-sdk

          echo ========================================
          echo GENERATING PLUGIN SDK VISUAL STUDIO PROJECTS
          echo ========================================
          echo PLUGIN_SDK_DIR=%PLUGIN_SDK_DIR%
          echo.

          call "tools\generate\Visual Studio.bat"

          if errorlevel 1 (
            echo Failed to generate Plugin SDK Visual Studio projects.
            exit /b 1
          )

      - name: Verify Generated Plugin SDK Project
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "VERIFYING GENERATED PLUGIN SDK PROJECT"
          Write-Host "========================================"

          Write-Host ""
          Write-Host "Generated solution/project files:"
          Write-Host "----------------------------------------"

          Get-ChildItem -Path $env:PLUGIN_SDK_DIR -Recurse -File -Include *.sln,*.slnx,*.vcxproj -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName

          Write-Host ""
          Write-Host "Searching for Plugin_SA project:"
          Write-Host "----------------------------------------"

          $pluginSaProjects = @(Get-ChildItem -Path $env:PLUGIN_SDK_DIR -Recurse -File -Filter "Plugin_SA.vcxproj" -ErrorAction SilentlyContinue)

          if ($pluginSaProjects.Count -eq 0) {
              Write-Error "Plugin_SA.vcxproj was not found."
              exit 1
          }

          foreach ($project in $pluginSaProjects) {
              Write-Host "Found Plugin_SA:"
              Write-Host $project.FullName
          }

          Write-Host ""
          Write-Host "Plugin-SDK project generation verified successfully."

      - name: Build Plugin SDK - GTA San Andreas
        shell: cmd
        run: |
          cd /d "%PLUGIN_SDK_DIR%"

          echo ========================================
          echo BUILDING PLUGIN SDK - GTA SAN ANDREAS
          echo ========================================
          echo Configuration: Release
          echo Platform: Mixed Platforms
          echo Target: plugin_sa
          echo.

          msbuild plugin.sln ^
            /property:Configuration=Release ^
            /property:Platform="Mixed Platforms" ^
            /target:plugin_sa ^
            /m ^
            /verbosity:minimal

          if errorlevel 1 (
            echo Plugin SDK GTA San Andreas build failed.
            exit /b 1
          )

      - name: Verify Plugin SDK Library
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "VERIFYING PLUGIN SDK LIBRARY"
          Write-Host "========================================"

          $pluginLib = Join-Path $env:PLUGIN_SDK_DIR "output\lib\plugin.lib"
          Write-Host "Expected library:"
          Write-Host $pluginLib

          if (Test-Path $pluginLib) {
              Write-Host ""
              Write-Host "Plugin SDK library found."
              Get-Item $pluginLib | Format-List Name, Length, LastWriteTime
          }
          else {
              Write-Host ""
              Write-Host "Available plugin libraries:"
              Get-ChildItem -Path $env:PLUGIN_SDK_DIR -Filter "plugin*.lib" -Recurse -ErrorAction SilentlyContinue |
                Select-Object FullName

              Write-Error "Required Plugin SDK library plugin.lib was not found."
              exit 1
          }

      - name: Patch Project Include Path
        shell: pwsh
        run: |
          $projectFile = Join-Path $env:GITHUB_WORKSPACE "main-repo\radar-trilogy-sa.vcxproj"

          if (-not (Test-Path $projectFile)) {
              Write-Error "Project file not found: $projectFile"
              exit 1
          }

          $content = Get-Content $projectFile -Raw
          $oldPath = '$(PLUGIN_SDK_DIR)\Plugin_SA\game_sa;'
          $newPath = '$(PLUGIN_SDK_DIR)\Plugin_SA\game_sa;' + '$(PLUGIN_SDK_DIR)\Plugin_SA\game_sa\enums;'

          if ($content.Contains('$(PLUGIN_SDK_DIR)\Plugin_SA\game_sa\enums;')) {
              Write-Host "Enum include path already exists."
          }
          else {
              $content = $content.Replace($oldPath, $newPath)
              Set-Content -Path $projectFile -Value $content -Encoding UTF8
              Write-Host "Added Plugin SDK enum include directory."
          }

          Write-Host ""
          Write-Host "Checking project include path..."
          $check = Get-Content $projectFile -Raw

          if ($check.Contains('$(PLUGIN_SDK_DIR)\Plugin_SA\game_sa\enums')) {
              Write-Host "Enum include path successfully added."
          }
          else {
              Write-Error "Failed to add enum include path."
              exit 1
          }

      - name: Build Radar Project
        shell: pwsh
        run: |
          cd "$env:GITHUB_WORKSPACE\main-repo"

          Write-Host "========================================"
          Write-Host "BUILDING RADAR PROJECT"
          Write-Host "========================================"
          Write-Host "Configuration: Release GTA-SA"
          Write-Host "Platform: Win32"
          Write-Host "Platform Toolset: v145"
          Write-Host "PLUGIN_SDK_DIR: $env:PLUGIN_SDK_DIR"

          msbuild radar-trilogy-sa.sln `
            /p:Configuration="Release GTA-SA" `
            /p:Platform=Win32 `
            /p:PlatformToolset=v145 `
            /p:PLUGIN_SDK_DIR="$env:PLUGIN_SDK_DIR" `
            /m `
            /v:minimal

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Radar project build failed."
              exit $LASTEXITCODE
          }

      - name: Verify Build Output
        shell: pwsh
        run: |
          $artifact = Join-Path $env:GITHUB_WORKSPACE "main-repo\bin\GTA-SA\Release\radar-trilogy-sa.asi"

          Write-Host "Expected artifact:"
          Write-Host $artifact

          if (Test-Path $artifact) {
              Write-Host ""
              Write-Host "BUILD SUCCESSFUL"
              Write-Host "ASI file found."
              Get-Item $artifact | Format-List Name, Length, LastWriteTime
          }
          else {
              Write-Error "radar-trilogy-sa.asi was not found."
              exit 1
          }

      - name: Upload Compiled ASI
        uses: actions/upload-artifact@v4
        with:
          name: radar-trilogy-sa
          path: main-repo/bin/GTA-SA/Release/radar-trilogy-sa.asi
          if-no-files-found: error
