name: Build Radar DLL

on:
  push:
    branches: [ "only-radar-old" ]
  pull_request:
    branches: [ "only-radar-old" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        ref: only-radar-old
        path: main-repo

    - name: Checkout Plugin SDK
      uses: actions/checkout@v4
      with:
        repository: DK22Pac/plugin-sdk
        path: plugin-sdk

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build Project with Plugin SDK Include Paths
      run: |
        # Mengatur path absolut dasar untuk SDK
        $sdkPath = "$(Get-Location)\plugin-sdk"
        $env:PLUGIN_SDK_DIR = $sdkPath
        echo "PLUGIN_SDK_DIR is set to: $env:PLUGIN_SDK_DIR"
        
        # Menyusun string direktori include yang bersih untuk compiler C++
        $includeDirs = "$sdkPath\shared;$sdkPath\plugin_sa;$sdkPath\plugin_sa\game_sa"
        
        cd main-repo
        # Menggunakan AdditionalIncludeDirectories untuk menyuntikkan dependensi secara paksa dan aman
        msbuild radar-trilogy-sa.sln /p:Configuration="Release GTA-SA" /p:Platform=Win32 /p:PlatformToolset=v143 /p:AdditionalIncludeDirectories="$includeDirs"

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-Radar-ASI
        path: |
          main-repo/**/Release GTA-SA/*.asi
          main-repo/**/Release GTA-SA/*.dll
          main-repo/**/Release/*.asi
          main-repo/**/Release/*.dll
