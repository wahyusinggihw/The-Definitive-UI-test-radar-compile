name: Build Radar DLL

on:
  push:
    branches: [ "only-radar-old" ]
  pull_request:
    branches: [ "only-radar-old" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout Radar Project
        uses: actions/checkout@v4
        with:
          ref: only-radar-old
          path: main-repo

      - name: Checkout Plugin SDK
        uses: actions/checkout@v4
        with:
          repository: DK22Pac/plugin-sdk
          path: plugin-sdk

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set Plugin SDK Environment
        shell: pwsh
        run: |
          $sdkPath = Join-Path $env:GITHUB_WORKSPACE "plugin-sdk"

          "PLUGIN_SDK_DIR=$sdkPath" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8

          Write-Host "PLUGIN_SDK_DIR = $sdkPath"

      - name: Check Plugin SDK
        shell: pwsh
        run: |
          Write-Host "Plugin SDK path:"
          Write-Host $env:PLUGIN_SDK_DIR

          Write-Host ""
          Write-Host "Checking required enum directory..."

          $enumPath = Join-Path `
            $env:PLUGIN_SDK_DIR `
            "Plugin_SA\game_sa\enums"

          if (Test-Path $enumPath) {
              Write-Host "Enum directory found:"
              Write-Host $enumPath
          }
          else {
              Write-Error "Enum directory not found!"
              exit 1
          }

      - name: Inspect Plugin SDK Build
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "PLUGIN SDK BUILD INSPECTION"
          Write-Host "========================================"

          Write-Host ""
          Write-Host "Plugin SDK path:"
          Write-Host $env:PLUGIN_SDK_DIR

          Write-Host ""
          Write-Host "----------------------------------------"
          Write-Host "Solution files"
          Write-Host "----------------------------------------"

          $solutions = Get-ChildItem `
            -Path $env:PLUGIN_SDK_DIR `
            -Filter "*.sln" `
            -Recurse `
            -ErrorAction SilentlyContinue

          if ($solutions) {
              $solutions |
                Select-Object -ExpandProperty FullName
          }
          else {
              Write-Host "No .sln files found."
          }

          Write-Host ""
          Write-Host "----------------------------------------"
          Write-Host "Project files related to Plugin SDK"
          Write-Host "----------------------------------------"

          $projects = Get-ChildItem `
            -Path $env:PLUGIN_SDK_DIR `
            -Filter "*.vcxproj" `
            -Recurse `
            -ErrorAction SilentlyContinue

          if ($projects) {
              $projects |
                Select-Object -ExpandProperty FullName
          }
          else {
              Write-Host "No .vcxproj files found."
          }

          Write-Host ""
          Write-Host "----------------------------------------"
          Write-Host "Existing output directory"
          Write-Host "----------------------------------------"

          $outputPath = Join-Path `
            $env:PLUGIN_SDK_DIR `
            "output"

          if (Test-Path $outputPath) {
              Write-Host "Output directory exists:"
              Write-Host $outputPath

              Get-ChildItem `
                -Path $outputPath `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object FullName
          }
          else {
              Write-Host "output directory does not exist yet."
          }

          Write-Host ""
          Write-Host "----------------------------------------"
          Write-Host "Searching for plugin.lib"
          Write-Host "----------------------------------------"

          $pluginLibs = Get-ChildItem `
            -Path $env:PLUGIN_SDK_DIR `
            -Filter "plugin*.lib" `
            -Recurse `
            -ErrorAction SilentlyContinue

          if ($pluginLibs) {
              Write-Host "Found library files:"
              $pluginLibs |
                Select-Object FullName
          }
          else {
              Write-Host "No plugin*.lib files found."
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "END PLUGIN SDK INSPECTION"
          Write-Host "========================================"

      - name: Patch Project Include Path
        shell: pwsh
        run: |
          $projectFile = Join-Path `
            $env:GITHUB_WORKSPACE `
            "main-repo\radar-trilogy-sa.vcxproj"

          if (-not (Test-Path $projectFile)) {
              Write-Error "Project file not found: $projectFile"
              exit 1
          }

          $content = Get-Content $projectFile -Raw

          $oldPath = '$(PLUGIN_SDK_DIR)\Plugin_SA\game_sa;'

          $newPath = `
            '$(PLUGIN_SDK_DIR)\Plugin_SA\game_sa;' +
            '$(PLUGIN_SDK_DIR)\Plugin_SA\game_sa\enums;'

          if (
            $content.Contains(
              '$(PLUGIN_SDK_DIR)\Plugin_SA\game_sa\enums;'
            )
          ) {
              Write-Host "Enum include path already exists."
          }
          else {
              $content = $content.Replace(
                $oldPath,
                $newPath
              )

              Set-Content `
                -Path $projectFile `
                -Value $content `
                -Encoding UTF8

              Write-Host "Added Plugin SDK enum include directory."
          }

          Write-Host ""
          Write-Host "Checking project include path..."

          $check = Get-Content $projectFile -Raw

          if (
            $check.Contains(
              '$(PLUGIN_SDK_DIR)\Plugin_SA\game_sa\enums'
            )
          ) {
              Write-Host "Enum include path successfully added."
          }
          else {
              Write-Error "Failed to add enum include path."
              exit 1
          }

      - name: Build Radar Project
        shell: pwsh
        run: |
          cd "$env:GITHUB_WORKSPACE\main-repo"

          Write-Host "========================================"
          Write-Host "BUILDING RADAR PROJECT"
          Write-Host "========================================"

          Write-Host "Configuration: Release GTA-SA"
          Write-Host "Platform: Win32"
          Write-Host "Platform Toolset: v145"
          Write-Host "PLUGIN_SDK_DIR: $env:PLUGIN_SDK_DIR"

          msbuild radar-trilogy-sa.sln `
            /p:Configuration="Release GTA-SA" `
            /p:Platform=Win32 `
            /p:PlatformToolset=v145 `
            /p:PLUGIN_SDK_DIR="$env:PLUGIN_SDK_DIR" `
            /m `
            /v:minimal

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Radar project build failed."
              exit $LASTEXITCODE
          }

      - name: Verify Build Output
        shell: pwsh
        run: |
          $artifact = Join-Path `
            $env:GITHUB_WORKSPACE `
            "main-repo\bin\GTA-SA\Release\radar-trilogy-sa.asi"

          Write-Host "Expected artifact:"
          Write-Host $artifact

          if (Test-Path $artifact) {
              Write-Host ""
              Write-Host "BUILD SUCCESSFUL"
              Write-Host "ASI file found."

              Get-Item $artifact |
                Format-List Name, Length, LastWriteTime
          }
          else {
              Write-Error "radar-trilogy-sa.asi was not found."
              exit 1
          }

      - name: Upload Compiled ASI
        uses: actions/upload-artifact@v4
        with:
          name: radar-trilogy-sa
          path: main-repo/bin/GTA-SA/Release/radar-trilogy-sa.asi
          if-no-files-found: error
