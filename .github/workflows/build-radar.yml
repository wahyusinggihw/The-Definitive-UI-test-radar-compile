name: Build Radar Plugin

on:
  push:
    branches:
      - only-radar-old
  pull_request:
    branches:
      - only-radar-old
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    # 1. Clone repository utama Anda (only-radar-old)
    - name: Checkout Main Repository
      uses: actions/checkout@v4
      with:
        ref: only-radar-old

    # 2. Clone repository plugin-sdk secara paralel ke folder khusus
    - name: Checkout plugin-sdk
      uses: actions/checkout@v4
      with:
        repository: DK22Pac/plugin-sdk
        path: plugin-sdk

    # 3. Setup MSBuild (Visual Studio compiler tools)
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # 4. Atur Variable Lingkungan wajib untuk plugin-sdk (Membantu VS mendeteksi SDK)
    - name: Set PLUGIN_SDK_DIR Environment Variable
      run: |
        echo "PLUGIN_SDK_DIR=${{ github.workspace }}\plugin-sdk" >> $GITHUB_ENV
      shell: bash

    # 5. [OPSIONAL] Jika Anda memang wajib mengompilasi SDK-nya terlebih dahulu
    # Menggunakan properti working-directory bawaan GitHub Actions agar aman dari error MSB1009
    - name: Pre-build plugin_sa SDK
      working-directory: ${{ github.workspace }}\plugin-sdk\plugin_sa
      run: |
        msbuild plugin_sa.vcxproj /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143
      shell: cmd

    # 6. Kompilasi Solusi Utama Anda
    - name: Build Main Solution
      run: |
        msbuild ${{ github.workspace }}\radar-trilogy-sa.sln /p:Configuration="Release GTA-SA" /p:Platform=Win32 /p:PlatformToolset=v143
      shell: cmd

    # 7. Ambil hasil kompilasi (.asi / .dll)
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: radar-trilogy-sa-release
        path: |
          **/Release GTA-SA/*.asi
          **/Release GTA-SA/*.dll
          **/bin/*.asi
          **/bin/*.dll
