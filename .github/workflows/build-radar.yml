name: Build Radar Plugin

on:
  push:
    branches:
      - only-radar-old
  pull_request:
    branches:
      - only-radar-old
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    # 1. Checkout kode dari branch only-radar-old
    - name: Checkout Main Repository
      uses: actions/checkout@v4
      with:
        ref: only-radar-old

    # 2. Checkout plugin-sdk ke folder terpisah
    - name: Checkout plugin-sdk
      uses: actions/checkout@v4
      with:
        repository: DK22Pac/plugin-sdk
        path: plugin-sdk

    # 3. Setup MSBuild (Visual Studio) terbaru
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # 4. Set Environment Variable wajib untuk plugin-sdk
    - name: Set PLUGIN_SDK_DIR Environment Variable
      run: |
        echo "PLUGIN_SDK_DIR=${{ github.workspace }}\plugin-sdk" >> $GITHUB_ENV
      shell: bash

    # 5. Proses Restore NuGet (diabaikan jika proyek tidak memakainya)
    - name: Restore NuGet Packages
      run: nuget restore ${{ github.workspace }}\radar-trilogy-sa.sln
      continue-on-error: true

    # 6. Kompilasi Proyek dengan konfigurasi 'Release GTA-SA' dan platform 'Win32'
    - name: Build Solution
      run: |
        msbuild ${{ github.workspace }}\radar-trilogy-sa.sln /p:Configuration="Release GTA-SA" /p:Platform=Win32
      shell: cmd

    # 7. Mengambil dan menyimpan hasil kompilasi (.asi atau .dll)
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: radar-trilogy-sa-release
        path: |
          **/Release GTA-SA/*.asi
          **/Release GTA-SA/*.dll
          **/bin/*.asi
          **/bin/*.dll
